<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Daymark — a simple task list</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">A little progress, every day</p>
        <h1>Make room for what matters.</h1>
        <p class="intro">A simple place to keep today’s tasks in view.</p>
      </header>

      <section class="task-panel" aria-labelledby="tasks-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Your list</p>
            <h2 id="tasks-heading">Today’s tasks</h2>
          </div>
          <p class="progress" id="progress" aria-live="polite"></p>
        </div>

        <form class="task-form" id="task-form">
          <label class="visually-hidden" for="task-input">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="120"
            placeholder="What would you like to get done?"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit">Add task</button>
        </form>

        <p class="notice" id="notice" role="status" aria-live="polite"></p>

        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>

        <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
        <p class="empty-state" id="empty-state">Nothing here yet. Add one small thing to get started.</p>
      </section>

      <footer class="page-footer">
        <span class="footer-mark" aria-hidden="true">✳</span>
        <p>Your tasks are saved in this browser on this device.</p>
      </footer>
    </main>
  </body>
</html>
